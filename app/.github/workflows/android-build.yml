name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs Gradle 9.3.1 itself, so gradlew / gradle-wrapper.jar are NOT required in the repo.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # Standard Android debug keystore (public password "android"; not a secret).
      # Restored only when the repo does not already contain one, so the SHA-1 stays stable.
      - name: Restore debug.keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            echo "" | base64 -d > debug.keystore
          fi

      - name: Add google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          fi
          if [ -f app/google-services.json ]; then
            echo "google-services.json found."
          else
            echo "::warning::app/google-services.json not found. Building with a placeholder so the build is green, but Google sign-in and Firebase will NOT work in this APK until you add app/google-services.json."
            mkdir -p app/src/main/res/values
            cat > app/src/main/res/values/zz_ci_fallback.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="default_web_client_id" translatable="false">missing-google-services-json</string>
          </resources>
          XML
          fi

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mousomi-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publishes the APK as a normal .apk file on the Releases page (no zip),
      # at a fixed link that always points to the newest build:
      # https://github.com/<user>/<repo>/releases/download/latest/Mousomi-AI.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK" Mousomi-AI.apk
          gh release delete latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create latest Mousomi-AI.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest build (#${{ github.run_number }})" \
            --notes "Debug APK built from commit $GITHUB_SHA" \
            --prerelease
